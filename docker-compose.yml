version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: dpi-postgres
    environment:
      POSTGRES_DB: dpi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init/02-create-airflow-db.sql:/docker-entrypoint-initdb.d/02-create-airflow-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dpi"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dpi-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: dpi-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "0N06X70sT72fE3kdwU-RWQ"
    ports:
      - "9092:9092"
      - "29092:29092"
      - "29093:29093"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - dpi-net

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    entrypoint: ["/usr/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        airflow db migrate
        airflow connections add 'dpi_postgres' \
          --conn-type 'postgres' \
          --conn-host 'postgres' \
          --conn-login 'postgres' \
          --conn-password 'secret' \
          --conn-schema 'dpi' \
          --conn-port 5432 || true
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:secret@postgres:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    networks:
      - dpi-net

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./:/workspace
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:secret@postgres:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - dpi-net

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: airflow webserver --port 8080
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      - ./:/workspace
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:secret@postgres:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - dpi-net

volumes:
  pgdata:
  kafkadata:

networks:
  dpi-net:
    driver: bridge
